<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HALOHEADS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#060709">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#060709; --ink:#e9edf0; --dim:#727d88; --line:rgba(255,255,255,.08);
      --acc:#33ffb0; --loss:#ff5d6c; --f:'Saira',-apple-system,sans-serif; }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:var(--bg); color:var(--ink); font-family:var(--f); font-weight:300; overflow-x:hidden;
      -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1}
    #scene{position:fixed; inset:0; width:100vw; height:100vh; z-index:0; display:block}
    .veil{position:fixed; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(135% 115% at 50% 34%, transparent 56%, rgba(0,0,0,.62) 100%)}
    #loader{position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; transition:opacity .6s ease}
    #loader.hidden{opacity:0; pointer-events:none}
    .ld-ring{width:40px; height:40px; border-radius:50%; border:2px solid rgba(51,255,176,.16); border-top-color:var(--acc); animation:ldspin .8s linear infinite}
    @keyframes ldspin{to{transform:rotate(360deg)}}
    header{position:fixed; top:0; left:0; right:0; z-index:40; display:flex; align-items:center;
      justify-content:space-between; padding:18px clamp(16px,4vw,52px) 24px}
    header::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
      background:linear-gradient(180deg, rgba(6,7,9,.9) 0%, rgba(6,7,9,.62) 52%, transparent 100%);
      backdrop-filter:blur(13px); -webkit-backdrop-filter:blur(13px);
      -webkit-mask-image:linear-gradient(180deg,#000 58%,transparent); mask-image:linear-gradient(180deg,#000 58%,transparent)}
    .mark{font-weight:500; letter-spacing:.42em; font-size:clamp(12px,1.5vw,16px); color:#fff}
    .mark i{color:var(--acc); font-style:normal}
    .up{font-size:12px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; text-decoration:none;
      color:#06120e; background:var(--acc); padding:10px 20px; border-radius:100px;
      box-shadow:0 8px 30px rgba(51,255,176,.28); transition:transform .2s, box-shadow .3s; white-space:nowrap}
    .up:hover{transform:translateY(-1px); box-shadow:0 10px 40px rgba(51,255,176,.5)}
    .hdr-actions{display:flex; align-items:center; gap:13px}
    .snd{display:grid; place-items:center; width:38px; height:38px; padding:0; border-radius:50%; cursor:pointer;
      color:var(--acc); background:rgba(51,255,176,.08); border:1px solid var(--line);
      transition:transform .2s, background .25s, color .25s; -webkit-tap-highlight-color:transparent}
    .snd:hover{transform:translateY(-1px); background:rgba(51,255,176,.16)}
    .snd svg{display:block}
    .snd.muted{color:var(--dim); background:rgba(255,255,255,.04)}
    .snd .slash{display:none}
    .snd.muted .waves{display:none}
    .snd.muted .slash{display:block}
    .snd[hidden]{display:none}
    .countdown{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none}
    .cd-label{font-size:9px; letter-spacing:.4em; color:var(--dim); text-transform:uppercase}
    .cd-time{font-size:15px; font-weight:500; letter-spacing:.12em; color:#fff; margin-top:3px}
    .cd-time b{color:var(--acc); font-weight:600}
    .cd-date{font-size:9.5px; letter-spacing:.2em; color:var(--acc); text-transform:uppercase; margin-top:4px; opacity:.9}
    @media(max-width:860px){ .countdown{display:none} }
    .hero{position:relative; z-index:5; min-height:100vh; min-height:100svh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; padding:0 22px; pointer-events:none}
    .kicker{font-size:clamp(9px,1.2vw,12px); letter-spacing:.55em; color:var(--acc); text-transform:uppercase;
      opacity:0; animation:rise .9s .2s ease forwards}
    .title{display:flex; justify-content:center; align-items:baseline; width:100%;
      font-weight:200; letter-spacing:.04em; line-height:.92; font-size:clamp(48px,13vw,176px); color:#fff;
      margin:18px 0 0; opacity:0; animation:rise 1s .35s ease forwards}
    .title .pre{flex:1 1 0; text-align:right; min-width:0}      /* HALO — grows, ends at centre */
    .title .post{flex:1 1 0; text-align:left; min-width:0}      /* HEADS — grows, starts at centre */
    .title .mid{flex:0 0 auto; position:relative; left:0.02em}  /* H — anchored to viewport centre */
    .sub{font-size:clamp(12px,1.4vw,15px); font-weight:300; letter-spacing:.06em; color:var(--dim);
      margin-top:22px; max-width:30ch; opacity:0; animation:rise 1s .55s ease forwards}
    @keyframes rise{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none}}
    .cue{position:absolute; bottom:26px; left:50%; transform:translateX(-50%); width:1px; height:50px;
      background:linear-gradient(var(--acc),transparent); opacity:.55; overflow:hidden}
    .cue::after{content:""; position:absolute; top:0; left:0; width:1px; height:16px; background:var(--acc);
      animation:trail 2.4s ease-in-out infinite}
    @keyframes trail{0%{transform:translateY(-16px)}70%{transform:translateY(50px); opacity:0}100%{opacity:0}}
    .stats{position:relative; z-index:20; max-width:1140px; margin:0 auto; padding:4vh clamp(14px,5vw,72px) 8vh}
    .sec{display:flex; align-items:baseline; gap:14px; margin:0 0 16px; flex-wrap:wrap}
    .sec h2{font-weight:300; letter-spacing:.3em; font-size:clamp(14px,2vw,20px); color:#fff; text-transform:uppercase}
    .sec span{font-size:11px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase}
    .panel{position:relative; border-radius:14px; overflow:hidden; margin-bottom:28px;
      background:rgba(12,15,19,.5); backdrop-filter:blur(26px) saturate(1.2); -webkit-backdrop-filter:blur(26px) saturate(1.2);
      border:1px solid var(--line); box-shadow:0 40px 90px rgba(0,0,0,.55);
      opacity:0; transform:translateY(28px); transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1)}
    .panel.in{opacity:1; transform:none}
    .scroller{overflow-x:auto; -webkit-overflow-scrolling:touch}
    table{width:100%; border-collapse:collapse; min-width:600px}
    th,td{padding:14px 15px; text-align:right; white-space:nowrap}
    th:nth-child(2),td:nth-child(2){text-align:left}
    thead th{font-weight:500; letter-spacing:.16em; font-size:10.5px; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line)}
    tbody td{font-size:15px; font-weight:300; color:#dfe6ea; border-bottom:1px solid rgba(255,255,255,.04)}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover{background:rgba(51,255,176,.04)}
    .rank{color:var(--dim)} .name{font-weight:500; color:#fff}
    .kd{font-weight:500; color:var(--acc)} .win{color:var(--acc)} .loss{color:var(--loss)}
    .empty{text-align:center; color:var(--dim); padding:44px; letter-spacing:.12em; font-size:13px; text-transform:uppercase}
    .gt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:20px}
    .gt-h{font-weight:500; letter-spacing:.18em; color:#fff; font-size:12.5px; padding:16px 18px 4px; text-transform:uppercase}
    table.gt{min-width:0}
    /* bottom big countdown */
    .bottom{position:relative; z-index:20; min-height:100vh; min-height:100svh; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start; text-align:center; padding:15svh 18px 14vh}
    .big-label{font-size:clamp(10px,1.6vw,14px); letter-spacing:.5em; color:var(--acc); text-transform:uppercase}
    .big-time{font-weight:200; letter-spacing:.02em; font-size:clamp(40px,11vw,150px); color:#fff; line-height:1; margin:18px 0;
      text-shadow:0 0 50px rgba(51,255,176,.18)}
    .big-time b{font-weight:300; color:var(--acc)}
    .big-time small{font-size:.34em; font-weight:300; color:var(--dim); letter-spacing:.04em}
    .big-sub{font-size:clamp(12px,1.5vw,15px); letter-spacing:.18em; color:var(--dim); text-transform:uppercase}
    .crew{position:relative; z-index:20; min-height:100vh; min-height:100svh; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start; text-align:center; padding:13svh 18px 14vh}
    .crew-label{font-size:clamp(11px,1.7vw,15px); letter-spacing:.5em; color:var(--acc); text-transform:uppercase}
    .crew-sub{font-size:clamp(11px,1.3vw,13px); letter-spacing:.22em; color:var(--acc); text-transform:uppercase; margin-top:12px}
    @media(max-width:600px){ th,td{padding:11px 10px; font-size:14px} }
  </style>
</head>
<body>
  <div id="loader"><div class="ld-ring"></div></div>
  <canvas id="scene"></canvas>
  <div class="veil"></div>

  <header>
    <div class="mark">HALO<i>HEADS</i></div>
    <div class="countdown"><div class="cd-label">Next Bloodletting</div><div class="cd-time" id="cd-time">—</div><div class="cd-date">July 6, 2026 · 7:00 PM CT</div></div>
    <div class="hdr-actions">
      <button id="snd-toggle" class="snd" type="button" aria-label="Toggle menu music" aria-pressed="true" hidden>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5v5h3.2l4.3 3.4V6.1L7.2 9.5H4z" fill="currentColor" stroke="none"/>
          <g class="waves"><path d="M15.2 8.8a4.5 4.5 0 0 1 0 6.4"/><path d="M17.8 6.2a8 8 0 0 1 0 11.6"/></g>
          <line class="slash" x1="3" y1="3" x2="21" y2="21" stroke="var(--loss)" stroke-width="2"/>
        </svg>
      </button>
      <label class="up" for="up-input">Upload</label>
      <input id="up-input" type="file" accept="image/*" multiple hidden>
    </div>
  </header>

  <section class="hero">
    <div class="kicker">Master Chief Collection · Carnage Reports</div>
    <h1 class="title"><span class="pre">HALO</span><span class="mid" id="hx">H</span><span class="post">EADS</span></h1>
    <div class="cue"></div>
  </section>

  <main class="stats">
    <div class="sec"><h2>Leaderboard</h2><span>Net K/D Ranking</span></div>
    <div class="panel" id="lb"><div class="scroller"><table id="leaderboard">
      <thead><tr><th>#</th><th>Username</th><th>Score</th><th>K</th><th>A</th><th>D</th><th>K/D</th><th>Win%</th><th>Games</th></tr></thead>
      <tbody></tbody></table></div></div>
    <div class="sec"><h2>By Gametype</h2><span>Per-mode performance</span></div>
    <div id="gametypes"></div>
  </main>

  <section class="bottom">
    <div class="big-label">Next Bloodletting</div>
    <div class="big-time" id="big-time">—</div>
    <div class="big-sub">July 6 · 7:00 PM · Austin, TX</div>
  </section>

  <section class="crew">
    <div class="crew-label">The Crew</div>
    <div class="crew-sub">Spartans of the bloodletting</div>
  </section>

  <audio id="snd-menu" src="/static/audio/menu.mp3" preload="auto" loop></audio>
  <audio id="snd-battle" src="/static/audio/battle.mp3" preload="auto" loop></audio>

  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('scene');
    const MOBILE = Math.min(innerWidth, innerHeight) < 760 || matchMedia('(pointer:coarse)').matches;
    const PR = Math.min(MOBILE ? 1.5 : 2, devicePixelRatio);   // lighter buffers on phones → loop hits 60fps so rotation tracks scroll
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(PR);
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060709);   // black bg — HDRI used for reflections only
    const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
    const rifleRig = new THREE.Group(); scene.add(rifleRig); rifleRig.position.x = -0.11;  // centre the glowing scope lens (the eye's anchor) — it sits right of the model's mass, so offset further left
    const warthogRig = new THREE.Group(); scene.add(warthogRig);   // dropped — under the countdown
    const computerRig = new THREE.Group(); scene.add(computerRig); // THE CREW — sci-fi monitor, screen faces camera
    const brLeftRig = new THREE.Group(); scene.add(brLeftRig);     // battle rifle behind HALO
    const brRightRig = new THREE.Group(); scene.add(brRightRig);   // battle rifle behind HEADS
    const brLeftTilt = new THREE.Group(); brLeftTilt.rotation.x = -Math.PI/2; brLeftRig.add(brLeftTilt);   // barrel UP
    const brRightTilt = new THREE.Group(); brRightTilt.rotation.x = -Math.PI/2; brRightRig.add(brRightTilt);
    brLeftRig.rotation.y = -Math.PI/2; brRightRig.rotation.y = Math.PI/2;   // STATIC mirrored broad sides — no spin
    function visWH(z){ const h = 2*z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)); return [h*(innerWidth/innerHeight), h]; }
    function setBRX(rig, sel, side){ const el=document.querySelector(sel); if(!el||!rig) return;     // BRs as bookends just outside HALOHEADS
      const r=document.createRange(); r.selectNodeContents(el); const b=r.getBoundingClientRect();
      const vw=visWH(camera.position.z)[0], lim=vw/2-0.55;   // keep the BR fully on-screen (clamps in on narrow viewports)
      rig.position.x = Math.max(-lim, Math.min(lim, ((side<0?b.left:b.right)/innerWidth - 0.5) * vw + side*0.55)); }
    function fitCamera(){ const a=innerWidth/innerHeight; const z = a<1 ? 8.6/(a*0.92) : 8.6;
      camera.position.set(0,0.1,z); camera.lookAt(0,0,0);
      warthogRig.position.set(0, -visWH(z)[1]*(a<1?0.05:0.18), 0);
      computerRig.position.set(0, -visWH(z)[1]*0.05, 0);
      setBRX(brLeftRig, '.title .pre', -1); setBRX(brRightRig, '.title .post', 1); }   // BRs as bookends — left & right ends of HALOHEADS
    fitCamera();
    if(document.fonts) document.fonts.ready.then(()=>{ setBRX(brLeftRig,'.title .pre',-1); setBRX(brRightRig,'.title .post',1); });

    const loaderEl=document.getElementById('loader'); let revealed=false;
    function reveal(){ if(revealed) return; revealed=true; loaderEl.classList.add('hidden'); setTimeout(()=>{ loaderEl.style.display='none'; }, 650); }
    const manager=new THREE.LoadingManager();
    manager.onLoad=()=>{ (renderer.compileAsync?renderer.compileAsync(scene,camera):Promise.resolve()).then(reveal,reveal); };   // precompile shaders, then reveal
    setTimeout(reveal, 9000);   // fallback if a load hangs
    function opaqueFix(root){ root.traverse(m=>{ if(m.isMesh){ (Array.isArray(m.material)?m.material:[m.material]).forEach(mat=>{   // GLBs flag everything transparent → make the opaque parts opaque+depth-writing so the warthog body stops rendering over its tyres
      if(mat.transparent && mat.opacity>=0.99){ mat.transparent=false; mat.depthWrite=true; mat.needsUpdate=true; } }); } }); }

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; // instant lighting
    new RGBELoader(manager).load('/static/models/env.hdr', (hdr)=>{        // real HDRI reflections (not shown)
      hdr.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = pmrem.fromEquirectangular(hdr).texture; hdr.dispose();
    });

    const key = new THREE.DirectionalLight(0xffffff, 2.3); key.position.set(5,7,6); scene.add(key);
    const back = new THREE.DirectionalLight(0xbfe9ff, 1.5); back.position.set(-6,2,-5); scene.add(back);
    scene.add(new THREE.AmbientLight(0x1a2630, 0.4));

    const N=380, dustBase=new Float32Array(N*3), dustPos=new Float32Array(N*3);
    for(let i=0;i<N*3;i++){ dustBase[i]=(Math.random()-0.5)*26; dustPos[i]=dustBase[i]; }
    const dg=new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
    const dust=new THREE.Points(dg, new THREE.PointsMaterial({color:0x33ffb0,size:0.013,transparent:true,opacity:0.3,depthWrite:false}));
    scene.add(dust); let dustT=0;

    const SCALE = 49.6;   // shared voxel scale (doubled — finer voxels) → identical voxel size on every mesh
    const dissolveList = [];
    // green cyber-voxel dissolve sampled in rig-local space (world-unit, rotation-stable) so every mesh shares one noise scale
    function makeDissolve(root, rigRef, flipH, ph){
      const u = { uD:{value:0}, uEdge:{value:0.05}, uScale:{value:SCALE}, uEC:{value:new THREE.Color(0x2bff9e)}, uRigInv:{value:new THREE.Matrix4()}, uYMin:{value:ph.yMin}, uYInv:{value:ph.yInv}, uFlipH:{value:flipH} };
      root.traverse(o=>{ if(o.isMesh){ (Array.isArray(o.material)?o.material:[o.material]).forEach(mat=>{
        mat.onBeforeCompile=(sh)=>{
          sh.uniforms.uD=u.uD; sh.uniforms.uEdge=u.uEdge; sh.uniforms.uScale=u.uScale; sh.uniforms.uEC=u.uEC; sh.uniforms.uRigInv=u.uRigInv; sh.uniforms.uYMin=u.uYMin; sh.uniforms.uYInv=u.uYInv; sh.uniforms.uFlipH=u.uFlipH;
          sh.vertexShader = sh.vertexShader
            .replace('#include <common>','#include <common>\nvarying vec3 vDP;\nuniform mat4 uRigInv;')
            .replace('#include <begin_vertex>','#include <begin_vertex>\nvDP = (uRigInv * modelMatrix * vec4(position,1.0)).xyz;');
          sh.fragmentShader = sh.fragmentShader
            .replace('#include <common>','#include <common>\nvarying vec3 vDP;uniform float uD;uniform float uEdge;uniform float uScale;uniform vec3 uEC;uniform float uYMin;uniform float uYInv;uniform float uFlipH;\nfloat dh(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}')
            .replace('#include <dithering_fragment>','#include <dithering_fragment>\n{float n=dh(floor(vDP*uScale));float h=clamp((vDP.y-uYMin)*uYInv,0.0,1.0);float v=abs(uFlipH-h)*0.75+n*0.25;if(v<uD)discard;float e=(1.0-clamp((v-uD)/uEdge,0.0,1.0))*smoothstep(0.0,0.02,uD);gl_FragColor.rgb+=uEC*e*3.4;}');
        };
        mat.needsUpdate=true;
      }); }});
      dissolveList.push({u, rig:rigRef});
      return u;
    }

    let rifleU=null, warthogU=null, computerU=null, screenU=null, brLeftU=null, brRightU=null;
    function place(o, target){ const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
      const sc=target/Math.max(s.x,s.y,s.z); o.scale.setScalar(sc); o.position.set(-c.x*sc,-c.y*sc,-c.z*sc);
      return { yMin:-s.y*sc/2, yInv:1/Math.max(1e-6,s.y*sc) }; }   // rig-local vertical extent for bottom→top dissolve

    const portrait = innerWidth/innerHeight < 1;
    new GLTFLoader(manager).load('/static/models/sniper.glb', (g)=>{ const o=g.scene; opaqueFix(o); const ph=place(o, 5.4); rifleRig.add(o); rifleU=makeDissolve(o, rifleRig, 0.0, ph); }, undefined, ()=>{});   // OUT bottom→top
    new GLTFLoader(manager).load('/static/models/warthog.glb', (g)=>{ const o=g.scene; opaqueFix(o); const ph=place(o, portrait?7.4:8.2); warthogRig.add(o); warthogU=makeDissolve(o, warthogRig, 1.0, ph); warthogU.uD.value=1; }, undefined, ()=>{});   // IN bottom→top
    const BR_SIZE = portrait ? 2.5 : 3.0;                                   // battle rifles: dissolve OUT early + spin opposite ways (before the sniper sweeps wide)
    new GLTFLoader(manager).load('/static/models/br55.glb', (g)=>{
      const a=g.scene, b=a.clone(true);
      b.traverse(o=>{ if(o.isMesh) o.material = Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone(); });
      opaqueFix(a); opaqueFix(b);
      place(a, BR_SIZE); brLeftTilt.add(a);  brLeftU=makeDissolve(a, brLeftRig, 0.0, {yMin:-BR_SIZE/2, yInv:1/BR_SIZE});
      place(b, BR_SIZE); brRightTilt.add(b); brRightU=makeDissolve(b, brRightRig, 0.0, {yMin:-BR_SIZE/2, yInv:1/BR_SIZE});
    }, undefined, ()=>{});
    // THE CREW — crew photo on a big glowing quad (no monitor); the warthog dissolves into it
    const crewImg=new Image();
    crewImg.onload=()=>{ const aspect=crewImg.naturalWidth/crewImg.naturalHeight, vwh=visWH(camera.position.z);
      const H=Math.min(vwh[1]*0.82, vwh[0]*0.97/aspect), W=H*aspect;   // as big as fits the viewport, at the photo aspect (fills the quad — no bars/crop)
      const tex=new THREE.Texture(crewImg); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=renderer.capabilities.getMaxAnisotropy(); tex.generateMipmaps=true; tex.minFilter=THREE.LinearMipmapLinearFilter; tex.needsUpdate=true;   // full-res, crisp
      const mat=new THREE.MeshStandardMaterial({color:0x000000, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:1.2, roughness:1, metalness:0, envMapIntensity:0, side:THREE.DoubleSide});  // glowing photo; lit material so the dissolve's objectNormal exists
      const quad=new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat);
      computerRig.add(quad); screenU=makeDissolve(quad, computerRig, 1.0, {yMin:-H/2, yInv:1/H}); screenU.uD.value=1;
    };
    crewImg.onerror=()=>{}; crewImg.src='/static/img/crew.jpg';

    const hdrRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type:THREE.HalfFloatType, samples: MOBILE?2:4 });
    const composer = new EffectComposer(renderer, hdrRT);
    composer.setPixelRatio(PR); composer.setSize(innerWidth, innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.44, 0.8, 0.85);
    composer.addPass(bloom); composer.addPass(new OutputPass());

    const bottomEl = document.querySelector('.bottom');
    const crewEl = document.querySelector('.crew');
    const clamp=(x)=>Math.min(1,Math.max(0,x));
    let docH=1, bottomTop=0, crewTop=0;                   // cached layout — never read inside the loop (no forced reflow)
    function recalc(){ docH=Math.max(1, document.documentElement.scrollHeight - innerHeight); bottomTop=bottomEl.offsetTop; crewTop=crewEl.offsetTop; }
    recalc();

    // ── menu↔battle music: equal-power crossfade locked to the sniper→warthog dissolve `d` ──
    const sndMenu=document.getElementById('snd-menu'), sndBattle=document.getElementById('snd-battle');
    const sndBtn=document.getElementById('snd-toggle'); const SND_VOL=0.42;
    let sndReady=false, sndStarted=false, sndMuted=localStorage.getItem('hh-muted')==='1', sndOk=0;
    function applyMusic(d){ if(!sndReady) return;                 // SAME d that drives the visual dissolve → audio & pixels move together
      sndMenu.volume   = Math.cos(d*Math.PI/2)*SND_VOL;          // choral: full on the sniper (d=0), gone by the warthog (d=1)
      sndBattle.volume = Math.sin(d*Math.PI/2)*SND_VOL; }        // battle riff: in with the warthog, holds full through the crew (d stays 1)
    function paintBtn(){ sndBtn.classList.toggle('muted', sndMuted); sndBtn.setAttribute('aria-pressed', String(!sndMuted)); }
    function startMusic(){ if(sndStarted||!sndReady) return; sndStarted=true; sndMenu.play().catch(()=>{}); sndBattle.play().catch(()=>{}); }
    function enableMusic(){ if(sndReady) return; sndReady=true;   // both tracks decoded → reveal the control + arm the start triggers
      sndMenu.muted=sndBattle.muted=sndMuted; sndBtn.hidden=false; paintBtn();
      ['scroll','wheel','pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev, startMusic, {once:true, passive:true}));   // first gesture unlocks audio (a desktop wheel-scroll alone can't, so back it with pointer/key)
      sndBtn.addEventListener('click', ()=>{ sndMuted=!sndMuted; localStorage.setItem('hh-muted', sndMuted?'1':'0');
        sndMenu.muted=sndBattle.muted=sndMuted; paintBtn(); if(!sndMuted) startMusic(); }); }
    [sndMenu, sndBattle].forEach(a=>{                             // only light up once BOTH files actually decode (missing → control stays hidden, page unaffected)
      if(a.readyState>=3){ if(++sndOk===2) enableMusic(); }
      else a.addEventListener('canplay', ()=>{ if(++sndOk===2) enableMusic(); }, {once:true});
      a.addEventListener('error', ()=>{ sndBtn.hidden=true; }, {once:true}); });

    (function loop(){
      requestAnimationFrame(loop);
      const p = Math.min(1, scrollY/docH);               // scroll-LOCKED, no smoothing/spring
      dustT += 0.016;                                    // green dust: slight curl-noise swirl + scroll parallax
      for(let i=0;i<N;i++){ const x=dustBase[i*3], y=dustBase[i*3+1], z=dustBase[i*3+2];
        dustPos[i*3]   = x + (Math.sin(y*0.5+dustT*0.3)+Math.cos(z*0.4-dustT*0.2))*0.26;
        dustPos[i*3+1] = y + (Math.sin(z*0.5-dustT*0.25)+Math.cos(x*0.4+dustT*0.18))*0.26;
        dustPos[i*3+2] = z + (Math.sin(x*0.5+dustT*0.22)+Math.cos(y*0.4-dustT*0.15))*0.26; }
      dg.attributes.position.needsUpdate=true; dust.position.y = -p*1.8;
      const ry = p*Math.PI*2.4;                          // tight rotation only — no auto-spin
      const dBR = clamp(p/0.13);                          // battle rifles dissolve OUT early — gone before the sniper rotates sideways
      rifleRig.rotation.set(0.05, ry, 0);                // sniper rotates; monitor stays STATIC
      warthogRig.rotation.y = ry;
      brLeftRig.rotation.y  = -Math.PI/2 + dBR*Math.PI*1.6;  // BRs spin OPPOSITE directions as they dissolve out
      brRightRig.rotation.y =  Math.PI/2 - dBR*Math.PI*1.6;
      rifleRig.updateMatrixWorld(); warthogRig.updateMatrixWorld(); computerRig.updateMatrixWorld(); brLeftRig.updateMatrixWorld(); brRightRig.updateMatrixWorld();
      dissolveList.forEach(({u,rig})=>{ u.uRigInv.value.copy(rig.matrixWorld).invert(); });   // un-rotate → stable, shared voxel scale
      const rTop = bottomTop - scrollY, cTop = crewTop - scrollY;
      const d  = clamp(((innerHeight - rTop)/innerHeight - 0.5)/0.44);        // sniper→warthog: once the countdown card clears (as before)
      const d2 = clamp(((innerHeight - cTop)/innerHeight - 0.5)/0.44);        // warthog→crew monitor (THE CREW) — good, keep
      applyMusic(d);                                                         // crossfade menu↔battle on the SAME signal as the rifle→warthog dissolve
      if(rifleU) rifleU.uD.value = d;                    // rifle dissolves OUT (centred, on the H)
      if(brLeftU) brLeftU.uD.value = dBR;                // battle rifles dissolve OUT (no rotation)
      if(brRightU) brRightU.uD.value = dBR;
      if(warthogU) warthogU.uD.value = Math.max(1.0 - d, d2);  // warthog IN with d, then OUT with d2
      if(computerU) computerU.uD.value = 1.0 - d2;       // crew monitor dissolves IN
      if(screenU) screenU.uD.value = 1.0 - d2;           // ...incl. the crew-photo screen plane
      rifleRig.visible = d < 0.999;
      brLeftRig.visible = brRightRig.visible = dBR < 0.999;
      warthogRig.visible = d > 0.001 && d2 < 0.999;      // skip geometry once fully dissolved
      computerRig.visible = d2 > 0.001;
      composer.render();
    })();

    addEventListener('resize', ()=>{ fitCamera(); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); recalc(); });
    addEventListener('load', recalc);

    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.1});
    document.querySelectorAll('.panel').forEach(p=>io.observe(p));

    const cell=(t,cls)=>{ const td=document.createElement('td'); td.textContent=t; if(cls) td.className=cls; return td; };
    function refreshStats(){
      fetch('/api/leaderboard').then(r=>r.json()).then(d=>{
        const tb=document.querySelector('#leaderboard tbody'); tb.innerHTML='';
        if(!d.length){ tb.innerHTML='<tr><td colspan="9" class="empty">No reports analyzed yet</td></tr>'; return; }
        d.forEach((p,i)=>{ const tr=document.createElement('tr');
          tr.appendChild(cell(i+1,'rank')); tr.appendChild(cell(p.gamertag,'name'));
          tr.appendChild(cell(p.score)); tr.appendChild(cell(p.kills)); tr.appendChild(cell(p.assists)); tr.appendChild(cell(p.deaths));
          tr.appendChild(cell(p.net_kd,'kd')); tr.appendChild(cell(Math.round(p.win_rate*100)+'%', p.win_rate>=0.5?'win':'loss')); tr.appendChild(cell(p.games)); tb.appendChild(tr); });
        recalc();
      });
      fetch('/api/gametypes').then(r=>r.json()).then(d=>{
        const wrap=document.getElementById('gametypes'); wrap.innerHTML='';
        const grid=document.createElement('div'); grid.className='gt-grid';
        Object.keys(d).forEach(gt=>{ const panel=document.createElement('div'); panel.className='panel in';
          const h=document.createElement('div'); h.className='gt-h'; h.textContent=gt; panel.appendChild(h);
          const sc=document.createElement('div'); sc.className='scroller';
          const table=document.createElement('table'); table.className='gt'; table.innerHTML='<thead><tr><th>Username</th><th>Score</th><th>K</th><th>A</th><th>D</th><th>K/D</th></tr></thead>';
          const tb=document.createElement('tbody');
          d[gt].forEach(p=>{ const tr=document.createElement('tr'); tr.appendChild(cell(p.gamertag,'name'));
            tr.appendChild(cell(p.score)); tr.appendChild(cell(p.kills)); tr.appendChild(cell(p.assists)); tr.appendChild(cell(p.deaths));
            tr.appendChild(cell(p.net_kd,'kd')); tb.appendChild(tr); });
          table.appendChild(tb); sc.appendChild(table); panel.appendChild(sc); grid.appendChild(panel); });
        wrap.appendChild(grid);
        recalc();
      });
    }
    refreshStats();

    // upload: top-right button → native multi-file picker → POST each shot to /upload → refresh (no separate upload page)
    const upInput=document.getElementById('up-input'), upLabel=document.querySelector('label.up');
    if(upInput) upInput.addEventListener('change', async ()=>{
      const files=[...upInput.files]; if(!files.length) return;
      const orig=upLabel.textContent; let ok=0;
      for(let i=0;i<files.length;i++){ upLabel.textContent=`Uploading ${i+1}/${files.length}…`;
        const fd=new FormData(); fd.append('image', files[i]);
        try{ const r=await fetch('/upload',{method:'POST',body:fd}); if(r.ok) ok++; }catch(e){} }
      upInput.value=''; upLabel.textContent = ok ? `Uploaded ${ok}` : 'Upload failed'; refreshStats();
      setTimeout(()=>{ upLabel.textContent=orig; }, 2800);
    });

    // countdown — 7:00 PM Central (Austin), July 6 2026 (CDT = -05:00) — top bar + big bottom
    const TARGET = new Date('2026-07-06T19:00:00-05:00');
    const cdt=document.getElementById('cd-time'), big=document.getElementById('big-time'), pad=n=>String(n).padStart(2,'0');
    (function tick(){
      const ms = TARGET - new Date();
      if(ms<=0){ cdt.textContent='LIVE NOW'; big.textContent='LIVE NOW'; }
      else { const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
        cdt.innerHTML=`<b>${d}</b>d <b>${pad(h)}</b>h <b>${pad(m)}</b>m <b>${pad(s)}</b>s`;
        big.innerHTML=`<b>${d}</b><small>d</small> <b>${pad(h)}</b><small>h</small> <b>${pad(m)}</b><small>m</small> <b>${pad(s)}</b><small>s</small>`; }
      setTimeout(tick,1000);
    })();

    if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
  </script>
</body>
</html>
